services:
  retrack_db:
    image: postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=retrack
    volumes:
      # PostgreSQL 18 uses a new layout and volume, preserving the PostgreSQL 16 data.
      - db_vol_retrack_pg18:/var/lib/postgresql
    networks:
      - net

volumes:
  db_vol_retrack_pg18:
    driver: local

networks:
  net:
    driver: bridge
