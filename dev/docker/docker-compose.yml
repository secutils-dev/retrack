services:
  retrack_db:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=retrack
    volumes:
      # PostgreSQL 18 uses a new layout and volume, preserving the PostgreSQL 16 data.
      - db_vol_retrack_pg18:/var/lib/postgresql
    networks:
      - net

volumes:
  db_vol_retrack_pg18:
    driver: local

networks:
  net:
    driver: bridge
